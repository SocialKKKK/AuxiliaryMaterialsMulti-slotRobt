id: app.operation_log.backfill_door_ts
dialect: sqlite
datasource: app.sqlite
operation: write
business_meaning: >-
  把后到的格口门时刻补进已经写好的那条业务记录（记录口径优化 §4 A 档，2026-10-09）。
  归还 / 领用是在开门**之前**提交并写记录的，关门确认时刻在写记录时还不存在；
  这条 UPDATE 只做「把 NULL 补上」，绝不改写任何已有值——库层还有
  trg_app_operation_log_append_only 触发器把这条约束钉住。
  定位用 **主键 id**（不是 (action_type, ts)）：ts 只精确到秒，而批量开门每格 400ms，
  同一种动作在同一秒出现两条是常态；按 ts 回填会把两条都填成同一个关门时刻 ——
  而且 UPDATE 是先执行、后检查影响行数，检查拦不住已经写坏的行。
sql: |
  UPDATE app_operation_log
     SET door_open_ts  = :door_open_ts,
         door_close_ts = :door_close_ts
   WHERE id = :id
     AND door_close_ts IS NULL;
params:
  - name: door_open_ts
  - name: door_close_ts
  - name: id
outputs:
  - rows_affected
result_cardinality: write
