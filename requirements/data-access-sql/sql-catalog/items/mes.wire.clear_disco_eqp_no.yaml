id: mes.wire.clear_disco_eqp_no
title: 清除焊丝发货柜标记（DISCOEQPNO）
system: MES
operation: write
dialect: oracle
risk_level: medium
status: verified
datasource: mes.oracle.main
purpose: 可用焊丝离开发货柜后，将 MES fw_material_indetail.DISCOEQPNO 置 NULL。
inputs:
  - name: sublot
    type: string
    required: true
    source: 焊丝批号 wire_lot_no
  - name: disco_eqp_no
    type: string
    required: true
    source: 当前柜小车名
sql: |
  UPDATE fw_material_indetail
  SET DISCOEQPNO = NULL
  WHERE sublot = :sublot
    AND DISCOEQPNO = :disco_eqp_no
result_cardinality: write
business_rule: 只清当前柜归属；0 行须复查，已 NULL 幂等成功、其他柜归属拒绝。仅在 available_wire 清格成功后调用。
